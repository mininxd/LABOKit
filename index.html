<!DOCTYPE html>
<html lang="en" data-theme="light" class="bg-base-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Tools</title>
</head>
<body class="min-h-screen">
    <div class="container mx-auto p-4 max-w-6xl">
        <h1 class="text-3xl font-bold text-center mb-4">AI Image Tools</h1>
        <div id="statusMessage" class="text-center italic text-base-content/60 mb-4">Waiting for JS...</div>

        <div class="card bg-base-100 shadow-xl">
            <div class="card-body p-6">

                <div class="flex justify-center mb-4">
                    <input type="file" id="imageInput" accept="image/*" class="file-input w-full max-w-xs" />
                </div>

                <div class="flex flex-wrap gap-4 mb-4">
                    <div class="flex flex-wrap gap-4 items-center p-4 bg-base-200 rounded-lg border border-base-300">
                        <h3 class="font-bold">Upscaler</h3>
                        <label for="scaleFactor">Scale:</label>
                        <select id="scaleFactor" class="select select-bordered">
                            <option value="2">2x</option>
                            <option value="4" selected>4x</option>
                            <option value="8">8x</option>
                        </select>

                        <label for="tileSize">Tile Size:</label>
                        <select id="tileSize" class="select select-bordered">
                            <option value="0">Off (Fast)</option>
                            <option value="128">128px (Low Mem)</option>
                            <option value="256">256px</option>
                            <option value="512">512px</option>
                        </select>

                        <button id="upscaleBtn" disabled class="btn btn-primary">Upscale</button>
                    </div>

                    <div class="flex flex-wrap gap-4 items-center p-4 bg-base-200 rounded-lg border border-base-300">
                        <h3 class="font-bold">Background</h3>
                        <button id="removeBgBtn" disabled class="btn btn-primary">Remove Background</button>
                    </div>

                    <div class="flex flex-wrap gap-4 items-center p-4">
                        <button id="clearBtn" class="btn btn-secondary">Clear All</button>
                    </div>
                </div>

                <div class="mb-4 p-4 bg-base-200 rounded-lg text-center" id="progressContainer" style="display: none;">
                    <div class="mb-2"><span id="progressText">Processing...</span></div>
                    <progress id="progressBar" value="0" max="100" class="progress w-full"></progress>
                </div>

                <div class="flex flex-wrap justify-center gap-6" id="imageContainer" style="display: none;">
                    <div class="card bg-base-100 shadow-sm w-auto">
                        <div class="card-body items-center text-center p-4">
                            <h3 class="card-title">Original Image</h3>
                            <figure class="overflow-auto">
                                <canvas id="originalCanvas" class="max-w-full h-auto bg-[linear-gradient(45deg,#ccc_25%,transparent_25%),linear-gradient(-45deg,#ccc_25%,transparent_25%),linear-gradient(45deg,transparent_75%,#ccc_75%),linear-gradient(-45deg,transparent_75%,#ccc_75%)] bg-[length:20px_20px] bg-[position:0_0,0_10px,10px_-10px,-10px_0px]"></canvas>
                            </figure>
                        </div>
                    </div>

                    <div class="card bg-base-100 shadow-sm w-auto">
                        <div class="card-body items-center text-center p-4">
                            <h3 class="card-title">Result Image</h3>
                            <figure class="overflow-auto">
                                <canvas id="resultCanvas" class="max-w-full h-auto bg-[linear-gradient(45deg,#ccc_25%,transparent_25%),linear-gradient(-45deg,#ccc_25%,transparent_25%),linear-gradient(45deg,transparent_75%,#ccc_75%),linear-gradient(-45deg,transparent_75%,#ccc_75%)] bg-[length:20px_20px] bg-[position:0_0,0_10px,10px_-10px,-10px_0px]"></canvas>
                            </figure>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/index.ts"></script>
</body>
</html>
